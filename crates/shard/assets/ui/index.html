<!doctype html>
<!--
    The Shard shell.

    One window holds everything: this page draws the title bar, the home screen,
    the library and the settings, and the browsing tabs are WebView2 children
    laid out underneath the strip at the top. The chip at the left of that strip
    is always the way home.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; media-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
<title>Shard</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
  <!-- The window's own bar. Dragging it moves the window; the buttons at the
       right are the system's three, drawn here so the whole frame is ours. -->
  <header id="bar">
    <!--
        The app's own mark, as the executable and the tray draw it: a rounded
        square cut by a diagonal gap. The same numbers as `uikit::icon` — half
        width 0.72, corner 0.22, gap half-width 0.11 — so the three cannot drift
        apart, and drawn as a shape rather than a picture so it is sharp at any
        size the window is scaled to.
    -->
    <button id="chip" title="홈으로">
      <svg viewBox="-1 -1 2 2" aria-hidden="true">
        <mask id="cut">
          <rect x="-.72" y="-.72" width="1.44" height="1.44" rx=".22" fill="#fff"/>
          <line x1="-1.5" y1="-1.5" x2="1.5" y2="1.5" stroke="#000" stroke-width=".22"/>
        </mask>
        <rect x="-.72" y="-.72" width="1.44" height="1.44" rx=".22" fill="currentColor" mask="url(#cut)"/>
      </svg>
      <span>Shard</span>
    </button>

    <!-- The tabs, beside the chip: the library is one of them, and so is every
         site being browsed. -->
    <nav id="tabs"></nav>
    <button id="newtab" title="새 탭"><svg viewBox="0 0 12 12"><path d="M6 2.4v7.2M2.4 6h7.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>

    <div id="drag"></div>

    <!-- Only the way out, the same as the browser window has always had: this
         window is closed to the tray, not minimised and maximised around. -->
    <div id="frame-buttons">
      <button data-window="close" title="닫기" class="danger"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
  </header>

  <!-- The address row, under the tabs, while a site is in front. The site
       itself is a web view of its own below this: Rust lays it out. -->
  <div id="address" hidden>
    <button data-steer="back" title="뒤로">‹</button>
    <button data-steer="forward" title="앞으로">›</button>
    <button data-steer="reload" title="새로고침">⟳</button>
    <input id="url" spellcheck="false" placeholder="주소 또는 검색어">
  </div>

  <main id="screen">
    <!-- Home: the engine, and the two places to go. -->
    <section id="home" class="view">
      <p class="wordmark">S H A R D</p>

      <!--
          The switch, to the same numbers the drawn one used: a 156 box, a body
          of radius 72, a ring around it, three soft rings behind for the glow,
          and a glyph of radius 72×0.42 whose arc opens at the top with the stem
          through the gap.
      -->
      <button id="power" aria-pressed="false" title="엔진 켜기/끄기">
        <svg viewBox="0 0 156 156" aria-hidden="true">
          <circle class="halo" cx="78" cy="78" r="98"/>
          <circle class="halo" cx="78" cy="78" r="89"/>
          <circle class="halo" cx="78" cy="78" r="80"/>
          <circle class="body" cx="78" cy="78" r="72"/>
          <circle class="ring" cx="78" cy="78" r="72"/>
          <path class="glyph" d="M103.53 61.80 A30.24 30.24 0 1 1 52.47 61.80"/>
          <path class="glyph" d="M78 38.69 V72.56"/>
        </svg>
      </button>

      <h1 id="headline">꺼짐</h1>
      <p id="detail">버튼을 눌러 시작하세요</p>
      <p id="note"></p>

      <div id="downloads"></div>

      <div id="go">
        <button data-go="settings" title="설정">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><g stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 4.2v2.4M12 17.4v2.4M4.2 12h2.4M17.4 12h2.4M6.5 6.5l1.7 1.7M15.8 15.8l1.7 1.7M17.5 6.5l-1.7 1.7M8.2 15.8l-1.7 1.7"/></g></svg>
        </button>
        <button data-go="library" title="보관함 — 받아 둔 영상과 음악">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10.5 9.2 15.5 12l-5 2.8z" fill="currentColor"/></svg>
        </button>
        <button data-go="browser" title="Shard 브라우저 — 영상 받기">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3 9h18" stroke="currentColor" stroke-width="1.7"/><circle cx="6" cy="7" r="0.9" fill="currentColor"/><circle cx="8.6" cy="7" r="0.9" fill="currentColor"/></svg>
        </button>
      </div>
    </section>

    <!--
        The library. Two tabs across the top, half the width each, and the sheet
        they open onto holds the folders and the files — so the list reads as
        that tab's contents rather than as a list with buttons above it.
    -->
    <section id="library" class="view" hidden>
      <div id="shelves">
        <!-- The lifted pill, one element that slides under whichever shelf is
             in force — a travelling thumb says "your press moved this here"
             where two pills blinking say only "the state changed". -->
        <div id="shelfPill"></div>
        <button class="shelf on" data-shelf="video">
          <svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10.5 9.4 15.6 12l-5.1 2.6z" fill="currentColor"/></svg>
          <span>영상</span>
        </button>
        <button class="shelf" data-shelf="music">
          <svg viewBox="0 0 24 24"><path d="M9 17V5.2l10-2V15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.6" cy="17.4" r="2.7" fill="currentColor"/><circle cx="16.6" cy="15.4" r="2.7" fill="currentColor"/></svg>
          <span>음악</span>
        </button>
      </div>

      <div id="sheet">
        <div id="folders"></div>
        <div id="files"></div>
        <p id="empty" hidden></p>
      </div>
    </section>

    <!-- The player: over the library, not a window of its own. -->
    <div id="player" hidden>
      <div id="stage">
        <video id="video" playsinline></video>
        <!-- Drawn to even weights: one stroke for the stem and the beam, two
             heads of the same radius sitting on the ends of it. -->
        <div id="art" hidden>
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <!-- The stems end inside the heads rather than against them, and the
                 heads are laid over at the angle a written note has, so the two
                 meet as one shape instead of a line stopping at a circle. -->
            <path d="M12.2 21.9V8.3l11.7-2.4V19.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <ellipse cx="9.2" cy="22.5" rx="4.3" ry="3.4" transform="rotate(-20 9.2 22.5)" fill="currentColor"/>
            <ellipse cx="20.8" cy="20.2" rx="4.3" ry="3.4" transform="rotate(-20 20.8 20.2)" fill="currentColor"/>
          </svg>
        </div>
      </div>

      <div id="controls">
        <div id="scrub"><div id="played"></div><div id="knob"></div></div>
        <div id="row">
          <button id="prev" title="이전 (PageUp)"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M12 3v10L5 8z" fill="currentColor"/><rect x="3" y="3" width="1.8" height="10" rx=".9" fill="currentColor"/></svg></button>
          <button id="play" title="재생/일시정지"></button>
          <button id="next" title="다음 (PageDown)"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 3v10l7-5z" fill="currentColor"/><rect x="11.2" y="3" width="1.8" height="10" rx=".9" fill="currentColor"/></svg></button>
          <!--
              Two arcs of one circle — centre (8,8), r 5 — each ending in an
              arrow head. The first drawing asked for r 5 between two points
              10.43 apart, and a chord cannot be longer than the diameter it
              spans: the renderer answers by inflating the radius until the arc
              fits, which is why the loop sat flattened and leaning sideways.
              Every endpoint is now computed on the circle, so nothing is
              stretched. The heads are two barbs at ±35° off the tangent, so
              they point the way the arc is actually travelling.
          -->
          <button id="onward" title="순서대로"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8A5 5 0 0 1 12.7 6.29"/><path d="M13.3 4.07 12.7 6.29 10.82 4.97"/><path d="M13 8A5 5 0 0 1 3.3 9.71"/><path d="M2.7 11.93 3.3 9.71 5.18 11.03"/></svg></button>
          <button id="shuffle" title="무작위"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h2.6l6.2 8H14"/><path d="M2 12h2.6l6.2-8H14"/><path d="M11.9 1.9 14 4l-2.1 2.1"/><path d="M11.9 9.9 14 12l-2.1 2.1"/></svg></button>
          <span id="title"></span>
          <span id="clock">0:00 / 0:00</span>
          <span class="spacer"></span>
          <button id="mute" title="음소거"></button>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="1" title="소리">
          <button id="rate" title="재생 속도">1×</button>
          <button id="full" title="전체화면">⛶</button>
          <button id="shut" title="닫기 (Esc)"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        </div>
        <p id="now"></p>
      </div>
    </div>

    <!-- The speeds, on a right-click of the rate button. -->
    <div id="rates" hidden></div>

    <!-- What a right-click offers, on a file or on a folder. -->
    <div id="menu" hidden>
      <button data-do="rename" data-on="file">이름 바꾸기</button>
      <button data-do="unfile" data-on="file">폴더에서 빼기</button>
      <hr data-on="file">
      <button data-do="delete" data-on="file" class="danger">삭제</button>
      <button data-do="dropFolder" data-on="folder" class="danger">폴더 삭제</button>
      <button data-do="hold" data-on="spot">재생 위치 저장</button>
      <button data-do="forget" data-on="spot">저장한 위치 지우기</button>
    </div>
    <section id="settings" class="view" hidden></section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
