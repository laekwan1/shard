[package]
name = "veil"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["desktop"]
# The Windows app: the core process manager, kill switch, tor, the window.
# Without it only the portable half remains — share-link parsing, profiles and
# sing-box config generation — which is what the phone app links so both builds
# produce the same configuration from the same link.
desktop = [
    "dep:eframe",
    "dep:egui",
    "dep:global-hotkey",
    "dep:qrcode",
    "dep:reqwest",
    "dep:tokio",
    "dep:tray-icon",
    "uikit/gui",
]

# The binary carries a requireAdministrator manifest, so its (empty) test
# harness cannot be launched by `cargo test`. All logic lives in the library.
[[bin]]
name = "veil"
path = "src/main.rs"
test = false
required-features = ["desktop"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.0"
crossbeam-channel = "0.5.16"
once_cell = "1.21.4"
parking_lot = "0.12.5"
percent-encoding = "2.3.2"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
toml = "1.1.4"
tracing = "0.1.44"
uikit = { path = "../uikit", default-features = false }
url = "2.5.8"

eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"], optional = true }
egui = { version = "0.35.0", optional = true }
global-hotkey = { version = "0.8.0", optional = true }
qrcode = { version = "0.14.1", default-features = false, optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "charset", "json"], optional = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "process", "fs", "signal"], optional = true }
tray-icon = { version = "0.24.2", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Com", "Win32_NetworkManagement_Ndis"] }

[build-dependencies]
# The icon is generated from the same marks the tray draws, so the build needs
# the drawing code — without its window dependencies.
uikit = { path = "../uikit", default-features = false }
winresource = "0.1.23"
