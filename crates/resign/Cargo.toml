[package]
name = "resign"
version.workspace = true
edition.workspace = true
license.workspace = true

# iOS 자체 서명 엔진 — ① 서명. apple-codesign(관대 라이선스)으로 실제 iOS 번들을
# PC에서 재서명·검증한다. 실기기 없이 여기까지 검증되는 조각.

[dependencies]
anyhow = "1"
# default features(notarize)는 AWS SDK+App Store Connect+reqwest(공증용)를 끈다 — 우리 서명엔
# 불필요하고 iOS 빌드에 무겁다. 서명 코어는 feature-gate가 아니라 항상 들어온다.
apple-codesign = { version = "0.29.0", default-features = false }
zip = "8.6.0"

# ③ Apple ID 로그인 + anisette = SideStore apple-private-apis 포팅(개인 사용이라 라이선스 무관).
# icloud_auth(로그인·2FA·GSA)와 omnisette(anisette 헤더)는 실제 구현이라 그대로 의존한다 —
# 호스트 컴파일 확인됨. rev 고정(재현성). 트림/버전정리는 폰 동작 확인 뒤(동작 전 최적화 금지).
# ② Developer API는 apple-private-apis에 스텁(todo!)뿐이라 여기서 안 씀 — dev_api.rs에 우리가 직접 구현.
# fork(laekwan1): omnisette가 anisette_url이 있으면 v1 원격을 우선하도록 패치 — iOS에서 온디바이스
# (SSC)·v3 프로비저닝이 ani.sidestore.io와 안 맞아(EndProvisioningError) 로그인이 막히던 것을,
# 잘 되는 v1(단순 GET)로 우회. auth.rs가 anisette_url을 ani.sidestore.io로 설정한다.
icloud_auth = { git = "https://github.com/laekwan1/apple-private-apis", rev = "6299d2b2068d2387da6f17bf6575f945bf938a75" }
omnisette   = { git = "https://github.com/laekwan1/apple-private-apis", rev = "6299d2b2068d2387da6f17bf6575f945bf938a75", features = ["remote-anisette"] }
# ② Developer API는 애플 개발자 서비스에 plist를 POST한다. 요청/응답이 전부 plist라 이 크레이트로
# 인코딩·파싱한다(데이터 포맷 원시함수라 예외). uuid는 requestId/machineId 생성용.
plist = "1"
uuid = { version = "1", features = ["v4"] }
# ② 전송층: 개발자 포털/GSA에 plist를 POST(reqwest), Xcode 앱토큰 완성용 HMAC-SHA256(checksum)과
# AES-GCM 복호(icloud_auth의 get_app_token이 복호 직전 todo!()라 우리가 마저 한다 — spd public이라
# fork 불필요). 전부 서명/암호 원시함수라 의존 예외 허용.
# gzip/deflate/brotli: 개발자 포털(developerservices2)은 응답을 압축해 보낸다 — 없으면 raw
# 압축 바이트를 plist로 읽으려다 실패한다(폰 로그로 확인, HTTP 200인데 본문이 바이너리).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "deflate", "brotli"] }
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
# ④ 설치/갱신: idevice(jkcoxson)로 폰 lockdownd에 붙어 misagent(㉮ 프로파일)·installation_proxy(㉯
# 앱)를 호출. ring 프로바이더가 iOS 크로스컴파일에 덜 까다롭다. **검증 0 — 폰에서만.**
# master(0.1.66)에 pin — 읽은 API(install_package/MisagentClient/TcpProvider)가 master 기준.
# xpc+rsd: iOS 17+ RemoteXPC/RSD 경로(설계 docs/RSD-설치.md). classic lockdown(62078)은 iOS 26에서
# 죽어(QueryType RST) 설치가 RSD로만 됨. c442bd2에 이미 RsdProvider for IpAddr(Architecture A)와
# install_package_with_callback_rsd가 있어 버전 범프 없이 rsd/xpc feature만 켠다. tunnel_tcp_stack/
# remote_pairing은 Architecture B(우리가 터널을 세워야 할 때)에만 필요 — probe로 A/B 확인 후 추가.
idevice = { git = "https://github.com/jkcoxson/idevice", rev = "c442bd235bd14d6d5c8f28f85c9e6179e3a4c3d5", default-features = false, features = ["ring", "installation_proxy", "misagent", "tcp", "afc", "heartbeat", "xpc", "rsd"] }
# iOS C ABI는 동기다. async 엔진을 current-thread 런타임으로 block_on하는 래퍼가 필요.
tokio = { version = "1", features = ["rt", "net", "time", "io-util"] }
# create_self_signed_code_signing_certificate가 chrono::Duration과 x509의 KeyAlgorithm을
# 요구한다. 둘 다 apple-codesign이 이미 끌어오는 것 — 서명 원시함수라 예외적으로 직접 의존.
chrono = "0.4"
x509-certificate = "0.24"
