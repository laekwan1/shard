[package]
name = "resign"
version.workspace = true
edition.workspace = true
license.workspace = true

# iOS 자체 서명 엔진 — ① 서명. apple-codesign(관대 라이선스)으로 실제 iOS 번들을
# PC에서 재서명·검증한다. 실기기 없이 여기까지 검증되는 조각.

[dependencies]
anyhow = "1"
# default features(notarize)는 AWS SDK+App Store Connect+reqwest(공증용)를 끈다 — 우리 서명엔
# 불필요하고 iOS 빌드에 무겁다. 서명 코어는 feature-gate가 아니라 항상 들어온다.
apple-codesign = { version = "0.29.0", default-features = false }
zip = "8.6.0"

# ③ Apple ID 로그인 + anisette = SideStore apple-private-apis 포팅(개인 사용이라 라이선스 무관).
# icloud_auth(로그인·2FA·GSA)와 omnisette(anisette 헤더)는 실제 구현이라 그대로 의존한다 —
# 호스트 컴파일 확인됨. rev 고정(재현성). 트림/버전정리는 폰 동작 확인 뒤(동작 전 최적화 금지).
# ② Developer API는 apple-private-apis에 스텁(todo!)뿐이라 여기서 안 씀 — dev_api.rs에 우리가 직접 구현.
icloud_auth = { git = "https://github.com/SideStore/apple-private-apis", rev = "03beb1aa42991ccdad6214dee77e72282bef461f" }
omnisette   = { git = "https://github.com/SideStore/apple-private-apis", rev = "03beb1aa42991ccdad6214dee77e72282bef461f" }
# ② Developer API는 애플 개발자 서비스에 plist를 POST한다. 요청/응답이 전부 plist라 이 크레이트로
# 인코딩·파싱한다(데이터 포맷 원시함수라 예외). uuid는 requestId/machineId 생성용.
plist = "1"
uuid = { version = "1", features = ["v4"] }
# ② 전송층: 개발자 포털/GSA에 plist를 POST(reqwest), Xcode 앱토큰 완성용 HMAC-SHA256(checksum)과
# AES-GCM 복호(icloud_auth의 get_app_token이 복호 직전 todo!()라 우리가 마저 한다 — spd public이라
# fork 불필요). 전부 서명/암호 원시함수라 의존 예외 허용.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
# create_self_signed_code_signing_certificate가 chrono::Duration과 x509의 KeyAlgorithm을
# 요구한다. 둘 다 apple-codesign이 이미 끌어오는 것 — 서명 원시함수라 예외적으로 직접 의존.
chrono = "0.4"
x509-certificate = "0.24"
