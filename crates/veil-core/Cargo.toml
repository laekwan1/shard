[package]
name = "veil-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
hex = "0.4.3"
percent-encoding = "2.3.2"
# The transport is real TLS 1.3. Nobody should write that themselves — rustls
# is the primitive this builds on, the same way an app builds on the OS crypto.
rustls = { version = "0.23.43", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.15.1"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0.9"

[dev-dependencies]
rcgen = "0.14.8"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
