# 재서명 엔진(crates/resign)이 iOS로 크로스컴파일되는지만 확인한다. Swift/C ABI를 얹기 전에,
# 엔진+무거운 의존(idevice·apple-codesign·omnisette·icloud_auth·aes-gcm·reqwest)이 aarch64-apple-ios로
# 빌드되는지가 최대 미지수다. Windows 호스트로는 못 하니 CI(macOS)로 먼저 통과시킨다.
name: resign iOS cross-compile

on:
  push:
    branches: [main]
    paths:
      - 'crates/resign/**'
      - 'Cargo.lock'
      - '.github/workflows/resign-ios.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain + iOS targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: resign-ios-cargo-${{ hashFiles('Cargo.lock') }}

      # build.rs가 iOS 타깃에서 벤더된 zsign(C++)을 cc로 컴파일한다 — OpenSSL 헤더가 필요하다.
      # 앱이 쓰는 OpenSSL.xcframework(krzyzanowskim) 헤더를 가져와 <openssl/*.h>로 풀리게 openssl/ 심링크로
      # 감싸고, 그 경로를 ZSIGN_OPENSSL_INCLUDE로 넘긴다(헤더는 슬라이스 무관 동일 — 컴파일용).
      - name: Fetch OpenSSL headers for zsign (build.rs)
        run: |
          set -eux
          mkdir -p build
          curl -fsSL https://github.com/krzyzanowskim/OpenSSL/releases/latest/download/OpenSSL.xcframework.zip -o /tmp/ossl.zip
          (cd build && unzip -oqq /tmp/ossl.zip)
          SLICE="$(ls -d build/OpenSSL.xcframework/ios-arm64 2>/dev/null || true)"
          [ -n "$SLICE" ] || SLICE="$(find build/OpenSSL.xcframework -maxdepth 1 -type d -name 'ios-arm64*' ! -name '*simulator*' ! -name '*maccatalyst*' | head -1)"
          HDR="$(find "$SLICE" -type d -name Headers | head -1)"
          test -n "$HDR" || { echo "OpenSSL Headers 못 찾음"; exit 1; }
          mkdir -p build/ossl-inc
          ln -sfn "$PWD/$HDR" build/ossl-inc/openssl
          test -f build/ossl-inc/openssl/pem.h || { echo "openssl/pem.h 없음"; exit 1; }
          echo "ZSIGN_OPENSSL_INCLUDE=$PWD/build/ossl-inc" >> "$GITHUB_ENV"

      # 라이브러리만(--lib): iOS 앱이 링크하는 건 lib이다. bin(main.rs)은 PC PoC 전용.
      # 이 빌드가 통과하면 build.rs의 zsign 컴파일 + 심 + engine.rs FFI 선언이 iOS로 성립함을 뜻한다.
      - name: Cross-compile resign for a device (aarch64-apple-ios)
        run: cargo build -p resign --lib --release --target aarch64-apple-ios

      - name: Cross-compile resign for the simulator (aarch64-apple-ios-sim)
        run: cargo build -p resign --lib --release --target aarch64-apple-ios-sim
