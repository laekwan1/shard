# Build the whole iOS app, not just the Rust core: assemble the xcframework,
# generate the Xcode project from project.yml, and compile the SwiftUI shell
# against it for the simulator (no signing needed). This proves the Swift ↔ C
# ABI bridge and the app sources build, the same way ios-build.yml proves the
# core links.
name: iOS app

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'ios/**'
      - '.github/workflows/ios-app.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain + iOS targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ios-app-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build the Rust xcframework
        run: bash ios/scripts/build-xcframework.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      # MobileVLCKit (the mkv/webm player) comes in via CocoaPods, which wraps
      # the generated project in a workspace the build steps then use.
      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Build the app for the simulator (compile check)
        run: |
          xcodebuild \
            -workspace ios/Shard.xcworkspace \
            -scheme Shard \
            -sdk iphonesimulator \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES EXCLUDED_ARCHS=x86_64 \
            build

      # A real-iPhone build (arm64, iphoneos SDK), unsigned. SideStore signs it
      # with the user's Apple ID on the device, so we ship it unsigned rather
      # than embedding any certificate here.
      - name: Build the app for a device (unsigned)
        run: |
          xcodebuild \
            -workspace ios/Shard.xcworkspace \
            -scheme Shard \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      # Package the .app as a .ipa (Payload/Shard.app, zipped). No signing.
      - name: Package unsigned .ipa
        run: |
          APP=$(find ios/build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app: $APP"
          rm -rf ios/build/payload && mkdir -p ios/build/payload/Payload
          cp -R "$APP" ios/build/payload/Payload/
          (cd ios/build/payload && zip -qry ../Shard-unsigned.ipa Payload)
          ls -la ios/build/Shard-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shard-unsigned-ipa
          path: ios/build/Shard-unsigned.ipa
          if-no-files-found: error
