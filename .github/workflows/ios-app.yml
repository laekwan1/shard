# Build the whole iOS app, not just the Rust core: assemble the xcframework,
# generate the Xcode project from project.yml, and compile the SwiftUI shell
# against it for the simulator (no signing needed). This proves the Swift ↔ C
# ABI bridge and the app sources build, the same way ios-build.yml proves the
# core links.
name: iOS app

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'ios/**'
      - '.github/workflows/ios-app.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain + iOS targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ios-app-cargo-${{ hashFiles('Cargo.lock') }}

      # OpenSSL.xcframework를 **xcframework 빌드보다 먼저** 가져온다 — build.rs가 iOS 타깃에서 벤더된
      # zsign(C++)을 cc로 컴파일할 때 OpenSSL 헤더가 필요하기 때문. Xcode 링크에도 쓰이므로 ios/build에
      # 둔다. <openssl/*.h>로 풀리게 openssl/ 심링크로 감싸고 ZSIGN_OPENSSL_INCLUDE로 넘긴다.
      - name: Fetch OpenSSL.xcframework (zsign build.rs 헤더 + Xcode 링크)
        run: |
          set -eux
          mkdir -p ios/build
          curl -fsSL https://github.com/krzyzanowskim/OpenSSL/releases/latest/download/OpenSSL.xcframework.zip -o /tmp/ossl.zip
          (cd ios/build && unzip -oqq /tmp/ossl.zip)
          test -d ios/build/OpenSSL.xcframework || { echo "OpenSSL.xcframework 없음"; exit 1; }
          SLICE="$(ls -d ios/build/OpenSSL.xcframework/ios-arm64 2>/dev/null || true)"
          [ -n "$SLICE" ] || SLICE="$(find ios/build/OpenSSL.xcframework -maxdepth 1 -type d -name 'ios-arm64*' ! -name '*simulator*' ! -name '*maccatalyst*' | head -1)"
          HDR="$(find "$SLICE" -type d -name Headers | head -1)"
          test -n "$HDR" || { echo "OpenSSL Headers 못 찾음"; exit 1; }
          mkdir -p ios/build/ossl-inc
          ln -sfn "$PWD/$HDR" ios/build/ossl-inc/openssl
          test -f ios/build/ossl-inc/openssl/pem.h || { echo "openssl/pem.h 없음"; exit 1; }
          echo "ZSIGN_OPENSSL_INCLUDE=$PWD/ios/build/ossl-inc" >> "$GITHUB_ENV"

      - name: Build the Rust xcframework
        # ANISETTE_URL: 전용 anisette 서버 주소를 **빌드 때** 앱에 기본값으로 주입(auth.rs option_env!).
        # 값은 저장소가 아니라 GitHub 암호화 시크릿에만 있다(저장소 PUBLIC — 서버 주소를 커밋에 안 남긴다).
        # ZSIGN_OPENSSL_INCLUDE는 위 단계가 GITHUB_ENV로 넘긴다(build.rs가 zsign 컴파일에 씀).
        env:
          ANISETTE_URL: ${{ secrets.ANISETTE_URL }}
        run: bash ios/scripts/build-xcframework.sh

      # ④ 온디바이스 설치: SideStore가 쓰는 minimuxer(usbmux+하트비트) + libimobiledevice C 스택.
      # OpenSSL은 위에서 이미 가져왔다. 전부 프리빌트 xcframework라 소스 C 빌드가 없다.
      - name: Fetch on-device install xcframeworks (minimuxer + libimobiledevice)
        run: |
          mkdir -p ios/build
          dl() { curl -fsSL "$1" -o /tmp/x.zip && (cd ios/build && unzip -oqq /tmp/x.zip) && echo "ok: $2"; }
          dl https://github.com/jkcoxson/minimuxer/releases/download/build/minimuxer.xcframework.zip minimuxer
          dl https://github.com/SideStore/libimobiledevice-xcframework/releases/latest/download/libimobiledevice.xcframework.zip libimobiledevice
          for f in minimuxer libimobiledevice OpenSSL; do test -d "ios/build/$f.xcframework" || { echo "$f.xcframework 없음"; exit 1; }; done
          ls -d ios/build/*.xcframework

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      # MobileVLCKit (the mkv/webm player) comes in via CocoaPods, which wraps
      # the generated project in a workspace the build steps then use.
      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Build the app for the simulator (compile check)
        run: |
          xcodebuild \
            -workspace ios/Shard.xcworkspace \
            -scheme Shard \
            -sdk iphonesimulator \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES EXCLUDED_ARCHS=x86_64 \
            build

      # A real-iPhone build (arm64, iphoneos SDK), unsigned. SideStore signs it
      # with the user's Apple ID on the device, so we ship it unsigned rather
      # than embedding any certificate here.
      - name: Build the app for a device (unsigned)
        run: |
          xcodebuild \
            -workspace ios/Shard.xcworkspace \
            -scheme Shard \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      # Package the .app as a .ipa (Payload/Shard.app, zipped). No signing.
      - name: Package unsigned .ipa
        run: |
          APP=$(find ios/build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app: $APP"
          rm -rf ios/build/payload && mkdir -p ios/build/payload/Payload
          cp -R "$APP" ios/build/payload/Payload/
          (cd ios/build/payload && zip -qry ../Shard-unsigned.ipa Payload)
          ls -la ios/build/Shard-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shard-unsigned-ipa
          path: ios/build/Shard-unsigned.ipa
          if-no-files-found: error
