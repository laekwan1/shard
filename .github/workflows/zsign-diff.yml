# zsign vs apple-codesign — 서명 실측 대조.
#
# 왜: iOS 26 설치 0xe8008016을 두고 "apple-codesign 서명이 비호환"이라는 가설이 있었는데, PC 실측
# 결과 apple-codesign 서명이 구조적으로 Apple 정품과 동등해 보였다(DER 엔티틀먼트 바이트 동일,
# exec_seg_flags·CMS 서명속성·Requirements 모두 존재). 그렇다면 zsign으로 바꿔도 안 고쳐질 공산이
# 크다. 이 워크플로가 그걸 **바이트로** 확정한다: 같은 앱을 zsign과 apple-codesign으로 각각 서명하고,
# 두 서명본을 (ⓐ zsign 자체 덤퍼 ⓑ apple-codesign 리더) 같은 잣대로 덤프해 diff한다. 차이가 없으면
# 원인은 서명기가 아니다(→ 설치 신원 불일치 등 다른 곳). 차이가 있으면 정확히 무엇인지 드러난다.
name: zsign vs apple-codesign diff

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/zsign-diff.yml'

jobs:
  diff:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Build zsign (macOS)
        run: |
          set -eux
          brew install pkg-config openssl@3
          git clone --depth 1 https://github.com/zhlynn/zsign zsign-src
          cd zsign-src
          # zhlynn/zsign 최신 구조: Makefile에 clean 타깃이 없다(이전 CI가 `make clean && make`에서
          # clean 실패로 make를 건너뛰어 바이너리를 못 만들었고, 그래서 diff가 apple(서명) vs zsign(미서명)
          # 이라 무의미했다). 그냥 make만 돌리고, brew openssl 경로를 g++가 찾게 CPATH/LIBRARY_PATH로 준다.
          OSSL="$(brew --prefix openssl@3)"
          export PKG_CONFIG_PATH="$OSSL/lib/pkgconfig"
          export CPATH="$OSSL/include" LIBRARY_PATH="$OSSL/lib"
          # 최신 zsign은 bin/zsign에 낸다. make가 실패하면 소스를 직접 g++로 묶는다(하위호환).
          make || {
            echo "::warning::make failed; compiling zsign directly with g++"
            g++ -std=c++14 -O2 -o bin/zsign *.cpp common/*.cpp \
              -I"$OSSL/include" -L"$OSSL/lib" -lcrypto || \
            g++ -std=c++14 -O2 -o zsign *.cpp common/*.cpp \
              -I"$OSSL/include" -L"$OSSL/lib" -lcrypto
          }
          # 실제로 생긴 바이너리를 찾는다(bin/zsign 또는 zsign). **없으면 여기서 실패**한다 —
          # 미서명 원본으로 조용히 diff 돌던 지난 실패를 되풀이하지 않는다.
          ZBIN="$(find "$PWD" -maxdepth 2 -type f -name zsign -perm -u+x | head -1)"
          test -n "$ZBIN" || { echo "::error::zsign binary not built"; ls -R; exit 1; }
          "$ZBIN" -v || true   # 버전 출력으로 빌드 확인(일부 버전은 -v 미지원)
          echo "ZSIGN=$ZBIN" >> "$GITHUB_ENV"

      - name: Self-signed identity + 4-key entitlements
        run: |
          set -eux
          # apple-codesign PoC(TEST_ENT)와 **같은 4키** — 두 서명기의 엔티틀먼트를 바이트로 비교하려면 동일해야 한다.
          cat > ent.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>application-identifier</key><string>DM94SF72RB.net.sw.shard.DM94SF72RB</string>
          <key>com.apple.developer.team-identifier</key><string>DM94SF72RB</string>
          <key>get-task-allow</key><true/>
          <key>keychain-access-groups</key><array><string>DM94SF72RB.net.sw.shard.DM94SF72RB</string></array>
          </dict></plist>
          PLIST
          # zsign이 쓸 self-signed 인증서+키(코드서명용). apple-codesign PoC는 자체 self-signed를 쓰지만
          # DER 엔티틀먼트·CD 구조는 인증서와 무관하므로 대조에 지장 없다(요구사항 CN·CMS 바이트만 다름).
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 365 -nodes \
            -subj "/CN=Apple Development: Shard Resign PoC/C=US"

      - name: Extract base app (from the unsigned ipa)
        run: |
          set -eux
          test -f release/ios/Shard-unsigned.ipa
          for d in base_apple base_zsign; do
            rm -rf "$d"; mkdir -p "$d"
            (cd "$d" && unzip -oqq "$OLDPWD/release/ios/Shard-unsigned.ipa")
          done
          ls -d base_apple/Payload/*.app base_zsign/Payload/*.app

      - name: Sign with apple-codesign (rcodesign) — **엔진과 동일 설정**
        run: |
          set -eux
          # rcodesign = apple-codesign의 CLI(엔진과 같은 크레이트/버전 0.29). 엔진 UnifiedSigner와
          # 같은 서명 코드를 쓴다. 결정적: 엔진은 **이중 CD**(주 SHA-1 + 대체 SHA-256)로 서명한다
          # (engine.rs: set_digest_type(Sha1)+add_extra_digest(Sha256)). 기본 rcodesign은 단일
          # SHA-256만 내므로, --digest를 두 번(sha1,sha256) 줘 엔진 출력과 **바이트로 동일**하게 맞춘다.
          # 첫 --digest=주 CD, 이후=대체 CD(cli/mod.rs: i==0→set_digest_type, else→add_extra_digest).
          cargo install apple-codesign --version 0.29.0
          cat cert.pem key.pem > identity.pem
          APP="$(ls -d base_apple/Payload/*.app)"
          rcodesign sign \
            --pem-source identity.pem \
            --digest sha1 --digest sha256 \
            --entitlements-xml-path ent.plist \
            "$APP" out_apple_app
          test -f out_apple_app/Shard

      - name: Sign with zsign
        run: |
          set -eux
          test -x "$ZSIGN"                      # 빌드 단계에서 보장하지만 재확인
          APP="$(ls -d base_zsign/Payload/*.app)"
          # -m(프로파일) 없이 -k/-c/-e 로 서명(구조 비교엔 embedded.mobileprovision 파일이 무관).
          # zsign은 기본이 이중 CD(hashType 1=SHA-1 주 + 2=SHA-256 대체) — 위 rcodesign과 같은 축.
          "$ZSIGN" -f -k key.pem -c cert.pem -e ent.plist "$APP" || {
            echo "::warning::zsign -k/-c/-e (no -m) failed; retrying ad-hoc for a structural sample"
            "$ZSIGN" -a -f "$APP" || true
          }
          test -f "$APP/Shard"
          # **실제로 서명이 박혔는지 검증**한다 — LC_CODE_SIGNATURE가 없으면(=미서명) 여기서 실패.
          # 지난 실패: zsign 빌드가 안 돼 미서명 원본으로 조용히 diff가 돌았다. 다시는 안 되게 막는다.
          otool -l "$APP/Shard" | grep -q LC_CODE_SIGNATURE || {
            echo "::error::zsign produced NO signature (no LC_CODE_SIGNATURE)"; exit 1;
          }
          cp -R "$APP" out_zsign_app

      # ── 1차(대표) 잣대: apple-codesign 자신의 리더로 **양쪽을 같은 눈**으로 읽어 diff한다.
      # 이게 핵심이다: 지금까지 폰 진단은 apple-codesign 출력을 apple-codesign 리더로만 봐서
      # "다 정상"으로 나왔다(자기 출력을 자기가 검증하는 맹점). zsign이 만든 **정상 설치되는** 서명을
      # 같은 리더로 나란히 놓으면, apple-codesign이 빠뜨리거나 다르게 쓰는 필드가 +/-로 드러난다.
      - name: DIFF (rcodesign 중립 리더) — apple-codesign(-) vs zsign(+)
        if: always()
        run: |
          set -eux
          ZAPP="$(ls -d out_zsign_app)"
          # 상세 YAML 덤프(각각) — 필드별 대조용.
          rcodesign print-signature-info out_apple_app/Shard > info_apple.yaml 2>&1 || true
          rcodesign print-signature-info "$ZAPP/Shard"       > info_zsign.yaml 2>&1 || true
          # diff-signatures: 두 서명을 같은 리더로 읽어 YAML changeset(-=apple, +=zsign).
          rcodesign diff-signatures out_apple_app/Shard "$ZAPP/Shard" > diff.rcodesign.txt 2>&1 || true
          echo "----- info_apple.yaml (head) -----"; sed -n '1,80p' info_apple.yaml || true
          echo "----- info_zsign.yaml (head) -----"; sed -n '1,80p' info_zsign.yaml || true
          echo "----- diff.rcodesign.txt -----";     sed -n '1,200p' diff.rcodesign.txt || true

      - name: Dump both — zsign's native dumper (2차 잣대, 서명기만 다름)
        if: always()
        run: |
          set -eux
          "$ZSIGN" out_apple_app/Shard            > dump_apple.zsign.txt 2>&1 || true
          "$ZSIGN" "$(ls -d out_zsign_app)/Shard" > dump_zsign.zsign.txt 2>&1 || true
          echo "===== DIFF (zsign dumper): apple-codesign(<) vs zsign(>) =====" | tee diff.zsign.txt
          diff dump_apple.zsign.txt dump_zsign.zsign.txt | tee -a diff.zsign.txt || true

      - name: Summary to the run log
        if: always()
        run: |
          {
            echo "## zsign vs apple-codesign — 요약"
            echo '엔진과 **동일 설정**(이중 CD SHA-1+SHA-256, 같은 4키 엔티틀먼트, 같은 self-signed 인증서)으로'
            echo '같은 앱을 두 서명기로 서명하고, apple-codesign 자신의 중립 리더로 나란히 대조.'
            echo '**diff가 비면** 원인은 서명기가 아니다(→ 프로파일/기기/설치 경로). **diff가 있으면** 그게 0xe8008016의 정체.'
            echo '### ① diff-signatures (중립 리더, apple-codesign `-` vs zsign `+`)'
            echo '```diff'; sed -n '1,200p' diff.rcodesign.txt 2>/dev/null; echo '```'
            echo '### ② zsign 덤퍼 diff (apple-codesign < vs zsign >)'
            echo '```'; sed -n '1,160p' diff.zsign.txt 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dumps + diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zsign-diff
          path: |
            info_apple.yaml
            info_zsign.yaml
            diff.rcodesign.txt
            dump_apple.zsign.txt
            dump_zsign.zsign.txt
            diff.zsign.txt
