# XcodeGen spec. `xcodegen generate` (run from ios/) writes Shard.xcodeproj from
# this, so no .pbxproj is hand-maintained in the repo. The Rust core is linked
# as build/ShardCore.xcframework, produced by scripts/build-xcframework.sh.
name: Shard
options:
  bundleIdPrefix: net.sw
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  Shard:
    type: application
    platform: iOS
    sources:
      - path: Shard/Sources
      - path: Shard/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.sw.shard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Shard/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Shard/Sources/Shard-Bridging-Header.h
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Header search path so the bridging header finds ShardCore.h inside the
        # xcframework slice at build time.
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Shard/Sources
    dependencies:
      - framework: build/ShardCore.xcframework
        embed: false
      # ④ 온디바이스 설치 스택(프리빌트 정적 xcframework, CI가 받아 둔다):
      # minimuxer(usbmux muxer) → libimobiledevice(C, 그 심볼 제공) → OpenSSL(libimobiledevice가 씀).
      - framework: build/minimuxer.xcframework
        embed: false
      - framework: build/libimobiledevice.xcframework
        embed: false
      # OpenSSL은 **동적** 프레임워크(MH_DYLIB)라 앱에 담아야(embed) dyld가 실행 시 찾는다.
      # embed:false면 링크는 되지만 실행이 안 된다(폰 확인). minimuxer·libimobiledevice는 정적(.a)이라 false.
      - framework: build/OpenSSL.xcframework
        embed: true
